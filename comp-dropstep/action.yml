name: cmp-comp-dropstep
description: Composite fixture for nested-action changes between versions (this is version C).
runs:
  using: composite
  steps:
    - shell: bash
      run: echo "CMP-RESULT action=comp-dropstep stage=main step=run version=$(cat "$GITHUB_ACTION_PATH/VERSION")"
    - uses: dattathallam/demo-workflows/node-pre@cmp-comp-moving
