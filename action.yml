name: 'Compliance Gate'
description: 'Resolves third-party actions on the runner to compliant versions (gacpm + curation APIs) and enforces them on disk; fails the workflow if a selected version is rejected.'
inputs:
  github-token:
    description: 'GitHub token used by gacpm/gh to read tags and download zipballs'
    required: false
    default: ${{ github.token }}
  api-base-url:
    description: 'Base URL of the curation mock server (exposes /filterVersions and /curation)'
    required: false
    default: 'https://bc8d-167-103-72-120.ngrok-free.app'
  summary-level:
    description: |
      Controls which rows appear in the job summary table.
      INFO (default): floating tags and branch refs only (e.g. @v1, @main); pinned SHA or absolute
        semver rows (e.g. @v1.0.0, @abc123...) are omitted. Rejections and filter-blocked candidates
        on floating refs are always shown.
      DEBUG: every evaluated action is shown regardless of ref type.
    required: false
    default: 'INFO'
runs:
  using: 'composite'
  steps:
    # Step 1: the runner must already have gacpm (built from gh-action-compliance), gh, jq, curl.
    - name: Preflight tooling
      shell: bash
      run: |
        missing=0
        for tool in gacpm gh jq curl; do
          if ! command -v "$tool" >/dev/null 2>&1; then
            echo "::error::required tool '$tool' not found on PATH"
            missing=1
          fi
        done
        if [ "$missing" -ne 0 ]; then
          echo "Install gacpm on the runner once:" >&2
          echo "  cd /path/to/gh-action-compliance && go build -o gacpm ./cmd/gacpm" >&2
          echo "  sudo cp gacpm /usr/local/bin/gacpm" >&2
          exit 1
        fi
        echo "preflight OK: gacpm, gh, jq, curl present"

    # Step 2: fetch the allow/block list configured in this repo's GitHub Actions settings.
    - name: Fetch GitHub Actions allow list
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        REPO="${GITHUB_REPOSITORY}"
        API="https://api.github.com"

        # Wrapper: retries curl up to 3 times (transient/5xx only) with a 15 s timeout.
        # Prints the response body to stdout and returns 0 on HTTP 200.
        # Returns 1 immediately on 401/403/404 — these are not transient.
        # Sets GH_API_HTTP_CODE so callers can inspect the last status code.
        GH_API_HTTP_CODE=""
        gh_api_get() {
          local url="$1"
          local attempt resp curl_exit
          GH_API_HTTP_CODE=""
          for attempt in 1 2 3; do
            resp=$(curl -s --max-time 15 \
              -w "\n%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$url" 2>/dev/null)
            curl_exit=$?
            if [ "$curl_exit" -ne 0 ]; then
              echo "::warning::curl network error (exit $curl_exit) on attempt $attempt for $url" >&2
              sleep 3; continue
            fi
            GH_API_HTTP_CODE=$(printf '%s' "$resp" | tail -n1)
            body=$(printf '%s' "$resp" | sed '$d')
            if [ "$GH_API_HTTP_CODE" = "200" ]; then
              printf '%s' "$body"
              return 0
            fi
            # 401/403/404 will not change on retry — bail immediately.
            case "$GH_API_HTTP_CODE" in
              401|403|404)
                echo "::warning::GitHub API returned HTTP $GH_API_HTTP_CODE for $url (not retrying)" >&2
                return 1 ;;
            esac
            echo "::warning::GitHub API returned HTTP $GH_API_HTTP_CODE on attempt $attempt for $url" >&2
            sleep 3
          done
          return 1
        }

        echo "Fetching Actions permissions for $REPO..."
        sha_pinning_required='false'
        if ! perms_resp=$(gh_api_get "$API/repos/$REPO/actions/permissions"); then
          case "$GH_API_HTTP_CODE" in
            403) echo "::warning::Token lacks repo admin permission — cannot read Actions policy. Defaulting allowed_actions to 'all'." ;;
            401) echo "::warning::Token is invalid or expired. Defaulting allowed_actions to 'all'." ;;
            404) echo "::warning::Repo not found or Actions disabled for $REPO. Defaulting allowed_actions to 'all'." ;;
            *)   echo "::warning::Could not reach GitHub API (HTTP ${GH_API_HTTP_CODE:-network error}). Defaulting allowed_actions to 'all'." ;;
          esac
          allowed_actions="all"
        else
          allowed_actions=$(printf '%s' "$perms_resp" | jq -r '.allowed_actions // "all"')
          sha_pinning_required=$(printf '%s' "$perms_resp" | jq -r '.sha_pinning_required // false')
        fi
        echo "allowed_actions policy: $allowed_actions"
        echo "sha_pinning_required: $sha_pinning_required"

        patterns='[]'
        github_owned_allowed='false'
        verified_allowed='false'
        if [ "$allowed_actions" = "selected" ]; then
          if ! selected_resp=$(gh_api_get "$API/repos/$REPO/actions/permissions/selected-actions"); then
            echo "::error::Policy is 'selected' but could not fetch selected-actions (HTTP ${GH_API_HTTP_CODE:-network error}). Cannot enforce allow list."
            exit 1
          fi
          github_owned_allowed=$(printf '%s' "$selected_resp" | jq -r '.github_owned_allowed // false')
          verified_allowed=$(printf '%s' "$selected_resp" | jq -r '.verified_allowed // false')
          patterns=$(printf '%s' "$selected_resp" | jq -c '.patterns_allowed // []')
          echo "github_owned_allowed: $github_owned_allowed"
          echo "verified_allowed: $verified_allowed"
          echo "patterns_allowed: $patterns"
        fi

        jq -nc \
          --arg  allowed_actions      "$allowed_actions" \
          --arg  repo_owner           "$GITHUB_REPOSITORY_OWNER" \
          --argjson github_owned_allowed "$github_owned_allowed" \
          --argjson verified_allowed     "$verified_allowed" \
          --argjson patterns             "$patterns" \
          --argjson sha_pinning_required "$sha_pinning_required" \
          '{
            allowed_actions:      $allowed_actions,
            repo_owner:           $repo_owner,
            github_owned_allowed: $github_owned_allowed,
            verified_allowed:     $verified_allowed,
            patterns:             $patterns,
            sha_pinning_required: $sha_pinning_required
          }' > "$RUNNER_TEMP/gh_allowed_patterns.json"
        echo "allow list saved to $RUNNER_TEMP/gh_allowed_patterns.json"

    # Step 3: scan _work/_actions, resolve+filter+curate each third-party action, enforce the
    # approved version on disk, and fail the job if anything is non-compliant.
    - name: Scan, gate, and enforce
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        API_BASE: ${{ inputs.api-base-url }}
        SELF_REPO: demo-workflows
        SUMMARY_LEVEL: ${{ inputs.summary-level }}
      run: |
        # GitHub runs composite bash steps with errexit (-e) on. gacpm intentionally
        # returns non-zero for unresolvable refs (e.g. 404 for a dep with no semver tags),
        # so disable errexit and branch on the reported status instead of aborting.
        set -u
        set -o pipefail
        set +e
        FILTER_URL="${API_BASE%/}/filterVersions"
        CURATION_URL="${API_BASE%/}/curation"
        ACTIONS_DIR="$(dirname "$RUNNER_WORKSPACE")/_actions"

        # Load policy fetched in the previous step.
        allow_list="$RUNNER_TEMP/gh_allowed_patterns.json"
        gh_allowed_actions=$(jq -r  '.allowed_actions'      "$allow_list")
        gh_repo_owner=$(jq -r       '.repo_owner'           "$allow_list")
        gh_github_owned=$(jq -r     '.github_owned_allowed' "$allow_list")
        gh_verified=$(jq -r         '.verified_allowed'     "$allow_list")
        gh_patterns=$(jq -c         '.patterns'             "$allow_list")
        gh_sha_pinning=$(jq -r      '.sha_pinning_required' "$allow_list")
        echo "GitHub Actions policy: allowed_actions=$gh_allowed_actions sha_pinning_required=$gh_sha_pinning"

        # is_sha_ref returns 0 if the given ref looks like a full 40-char commit SHA.
        is_sha_ref() { [[ "$1" =~ ^[0-9a-fA-F]{40}$ ]]; }

        # is_floating_ref returns 0 if the ref is a floating tag or branch (not a pinned SHA
        # or an absolute semver like v1.2.3). Used to decide INFO-level summary filtering.
        is_floating_ref() {
          local r="$1"
          is_sha_ref "$r" && return 1                       # full SHA — pinned
          [[ "$r" =~ ^v?[0-9]+\.[0-9]+\.[0-9] ]] && return 1  # vX.Y.Z — absolute semver
          return 0                                          # vX, main, latest, etc. — floating
        }

        # gate_action <owner> <repo> <ref> <ref_dir>
        # Checks one action: SHA pinning, allow-list, gacpm, filterVersions, curation.
        # ref_dir: path to enforce on disk (enforcement mode). Empty = check-only, skip disk swap.
        gate_action() {
          local owner="$1" repo="$2" ref="$3" ref_dir="${4:-}"
          local pkg="$owner/$repo"

          # Skip GitHub-native actions and this gate's own action.
          case "$owner" in
            actions|github) echo "skip native $pkg@$ref"; return 0 ;;
          esac
          if [ "$repo" = "$SELF_REPO" ]; then
            echo "skip self $pkg@$ref"; return 0
          fi

          # --- SHA pinning check ---
          # Must run before allow-list so a pinning violation is always surfaced.
          if [ "$gh_sha_pinning" = "true" ] && ! is_sha_ref "$ref"; then
            echo "REJECTED $pkg@$ref: repo policy requires actions pinned to a full commit SHA"
            printf 'REJECTED\t%s\t%s\t\t\tsha-pinning-required\n' "$pkg" "$ref" >> "$verdicts"
            return 0
          fi

          # --- GitHub Actions allow-list check ---
          if [ "$gh_allowed_actions" = "local_only" ]; then
            echo "REJECTED $pkg@$ref: GitHub policy allows local actions only"
            printf 'REJECTED\t%s\t%s\t\t\tgithub-policy-local-only\n' "$pkg" "$ref" >> "$verdicts"
            return 0
          fi

          if [ "$gh_allowed_actions" = "selected" ]; then
            local is_allowed=0

            # (a) Same-owner actions are implicitly allowed.
            # The "Allow <owner> and select non-<owner>" policy never lists the owner's
            # own actions in patterns_allowed; they are unconditionally permitted.
            if [ "$owner" = "$gh_repo_owner" ]; then
              is_allowed=1
              echo "allow-list OK (same owner): $pkg@$ref"
            fi

            # (b) GitHub-owned actions (actions/*, github/*) — controlled by github_owned_allowed.
            # These are already skipped above but guard here for correctness.
            if [ "$is_allowed" -eq 0 ] && [ "$gh_github_owned" = "true" ]; then
              case "$owner" in
                actions|github) is_allowed=1; echo "allow-list OK (github_owned_allowed): $pkg@$ref" ;;
              esac
            fi

            # (c) Marketplace verified creators — controlled by verified_allowed.
            # The API does not expose a machine-readable verified-creator list, so when
            # verified_allowed=true we allow any action not explicitly blocked by a ! pattern.
            # The filterVersions + curation steps still apply as a second layer of control.
            if [ "$is_allowed" -eq 0 ] && [ "$gh_verified" = "true" ]; then
              is_allowed=1
              echo "allow-list OK (verified_allowed=true, subject to block patterns): $pkg@$ref"
            fi

            # (d) Explicit patterns_allowed entries.
            # Entries prefixed with ! are block rules and take precedence over any allow above.
            local is_blocked=0
            while IFS= read -r pattern; do
              if [[ "$pattern" == "!"* ]]; then
                # Block pattern: strip the ! and match.
                local block_pkg="${pattern#!}"; block_pkg="${block_pkg%%@*}"
                local block_ref="${pattern#*@}"
                if [ "$block_pkg" = "$pkg" ] && { [ "$block_ref" = "*" ] || [ "$block_ref" = "$ref" ]; }; then
                  is_blocked=1
                  break
                fi
              else
                # Allow pattern: only checked when not yet allowed.
                if [ "$is_allowed" -eq 0 ]; then
                  local pat_pkg="${pattern%%@*}"
                  local pat_ref="${pattern#*@}"
                  if [ "$pat_pkg" = "$pkg" ] && { [ "$pat_ref" = "*" ] || [ "$pat_ref" = "$ref" ]; }; then
                    is_allowed=1
                  fi
                fi
              fi
            done < <(printf '%s' "$gh_patterns" | jq -r '.[]')

            if [ "$is_blocked" -eq 1 ]; then
              echo "REJECTED $pkg@$ref: explicitly blocked by patterns_allowed entry"
              printf 'REJECTED\t%s\t%s\t\t\tgithub-explicitly-blocked\n' "$pkg" "$ref" >> "$verdicts"
              return 0
            fi

            if [ "$is_allowed" -eq 0 ]; then
              echo "REJECTED $pkg@$ref: not in GitHub Actions allow list"
              printf 'REJECTED\t%s\t%s\t\t\tgithub-not-allowed\n' "$pkg" "$ref" >> "$verdicts"
              return 0
            fi

            echo "allow-list OK: $pkg@$ref"
          fi

          echo "::group::$pkg@$ref"

          # (1) Resolve all versions via the package manager. Retry a few times to
          # ride out transient gh network blips on gacpm's auth call.
          local list_json="" status=""
          for attempt in 1 2 3; do
            list_json=$(gacpm list "$pkg@$ref" 2>/dev/null)
            status=$(printf '%s' "$list_json" | jq -r '.status // empty' 2>/dev/null)
            [ "$status" = "200" ] && break
            echo "gacpm list attempt $attempt for $pkg@$ref: status=${status:-none}; retrying"
            sleep 2
          done
          if [ "$status" != "200" ]; then
            echo "WARN: gacpm could not resolve $pkg@$ref (status=${status:-none}); skipping"
            printf '%s' "$list_json" | jq -r '.error // empty' 2>/dev/null
            echo "::endgroup::"
            return 0
          fi

          # (2) Build [[downloadUrl, version], ...] for the filter API.
          local pairs
          pairs=$(printf '%s' "$list_json" | jq -c '[.versions[] | [.downloadUrl, .version]]')
          echo "candidates: $(printf '%s' "$list_json" | jq -c '[.versions[].version]')"

          # (3) filterVersions -> blocked_versions.
          # Remove versions explicitly blocked by GitHub's patterns_allowed
          # (e.g. "!mikefarah/yq@v4.53.2") before sending to the curation API
          # so the server never sees versions the repo policy already rejects.
          local gh_pkg_blocked
          gh_pkg_blocked=$(printf '%s' "$gh_patterns" | jq -c \
            --arg pkg "$pkg" \
            '[.[] | select(startswith("!")) | ltrimstr("!") | select(split("@")[0] == $pkg) | split("@")[1]]')
          pairs=$(jq -nc \
            --argjson pairs "$pairs" \
            --argjson gh_blocked "$gh_pkg_blocked" \
            '$pairs | map(select(.[1] as $v | ($gh_blocked | index($v)) | not))')
          echo "candidates after github block filter: $(printf '%s' "$pairs" | jq -c '[.[].1]')"
          local filter_body filter_resp blocked
          filter_body=$(jq -nc --arg pkg "$pkg" --argjson versions "$pairs" '{package:$pkg, versions:$versions}')
          filter_resp=$(curl -s -X POST "$FILTER_URL" -H 'Content-Type: application/json' -d "$filter_body")
          blocked=$(printf '%s' "$filter_resp" | jq -c '.blocked_versions // []' 2>/dev/null || echo '[]')
          echo "blocked: $blocked"

          # Record each version screened out by filterVersions so the summary can show
          # which candidates were considered but rejected before the final pick.
          while IFS= read -r _bver; do
            [ -z "$_bver" ] && continue
            printf 'FILTERED\t%s\t%s\t%s\t\tfilter-blocked\n' "$pkg" "$ref" "$_bver" >> "$verdicts"
          done < <(printf '%s' "$blocked" | jq -r '.[]' 2>/dev/null)

          # (4) Remove blocked versions, pick the 0th (latest) remaining.
          local picked picked_url picked_ver
          picked=$(jq -nc --argjson pairs "$pairs" --argjson blocked "$blocked" \
            '$pairs | map(select(.[1] as $v | ($blocked | index($v)) | not)) | .[0] // empty')
          if [ -z "$picked" ] || [ "$picked" = "null" ]; then
            echo "REJECTED $pkg@$ref: no compliant version after filtering"
            printf 'REJECTED\t%s\t%s\t\t\tno-compliant-version\n' "$pkg" "$ref" >> "$verdicts"
            echo "::endgroup::"
            return 0
          fi
          picked_url=$(printf '%s' "$picked" | jq -r '.[0]')
          picked_ver=$(printf '%s' "$picked" | jq -r '.[1]')
          echo "selected: $picked_ver"

          # Resolve the commit SHA for the selected version tag (used in job summary).
          local commit_sha=""
          commit_sha=$(gh api "repos/$pkg/commits/$picked_ver" --jq '.sha' 2>/dev/null || true)

          # (5) curation -> approve (200) or reject (403).
          local cur_body cur_out cur_code cur_resp
          cur_body=$(jq -nc --arg pkg "$pkg" --arg url "$picked_url" '{package:$pkg, downloadUrl:$url}')
          cur_out="$(mktemp)"
          cur_code=$(curl -s -o "$cur_out" -w "%{http_code}" -X POST "$CURATION_URL" -H 'Content-Type: application/json' -d "$cur_body")
          cur_resp=$(cat "$cur_out"); rm -f "$cur_out"
          if [ "$cur_code" != "200" ]; then
            echo "REJECTED $pkg@$ref: curation $cur_code $cur_resp"
            printf 'REJECTED\t%s\t%s\t%s\t\tcuration-%s\n' "$pkg" "$ref" "$picked_ver" "$cur_code" >> "$verdicts"
            echo "::endgroup::"
            return 0
          fi
          echo "APPROVED $pkg@$ref -> $picked_ver"

          # (6) Enforce: replace the on-disk action with the approved version's contents.
          # Skipped in check-only mode (ref_dir is empty).
          if [ -n "$ref_dir" ]; then
            echo "enforcing $picked_ver into $ref_dir"
            find "$ref_dir" -mindepth 1 -delete
            local install_out
            install_out="$(mktemp)"
            if gacpm install --dest "$ref_dir" "$pkg@$picked_ver" >"$install_out" 2>&1; then
              echo "installed $picked_ver into $ref_dir"
              printf 'APPROVED\t%s\t%s\t%s\t%s\tenforced\n' "$pkg" "$ref" "$picked_ver" "$commit_sha" >> "$verdicts"
            else
              echo "ERROR installing $picked_ver:"; cat "$install_out"
              printf 'REJECTED\t%s\t%s\t%s\t%s\tinstall-failed\n' "$pkg" "$ref" "$picked_ver" "$commit_sha" >> "$verdicts"
            fi
            rm -f "$install_out"
          else
            echo "check-only: approved $picked_ver (no on-disk enforcement)"
            printf 'APPROVED\t%s\t%s\t%s\t%s\tcheck-only\n' "$pkg" "$ref" "$picked_ver" "$commit_sha" >> "$verdicts"
          fi

          echo "::endgroup::"
        }

        verdicts="$(mktemp)"

        if [ -n "${INPUT_ACTIONS:-}" ]; then
          echo "Check-only mode: verifying explicit action list (no on-disk enforcement)"
          while IFS= read -r _action_ref; do
            _action_ref="${_action_ref#"${_action_ref%%[![:space:]]*}"}"
            _action_ref="${_action_ref%"${_action_ref##*[![:space:]]}"}"
            [[ -z "$_action_ref" ]] && continue
            _owner=$(printf '%s' "$_action_ref" | cut -d/ -f1)
            _repo=$(printf '%s' "$_action_ref" | cut -d/ -f2 | cut -d@ -f1)
            _ref=$(printf '%s' "$_action_ref" | cut -d@ -f2)
            gate_action "$_owner" "$_repo" "$_ref" ""
          done <<< "${INPUT_ACTIONS}"
        else
          echo "Scanning $ACTIONS_DIR for third-party actions..."
          if [ ! -d "$ACTIONS_DIR" ]; then
            echo "No _actions directory found; nothing to gate."
            exit 0
          fi
          # Process substitution keeps the loop in the current shell (so verdicts persist).
          while IFS= read -r ref_dir; do
            _owner=$(basename "$(dirname "$(dirname "$ref_dir")")")
            _repo=$(basename "$(dirname "$ref_dir")")
            _ref=$(basename "$ref_dir")
            gate_action "$_owner" "$_repo" "$_ref" "$ref_dir"
          done < <(find "$ACTIONS_DIR" -mindepth 3 -maxdepth 3 -type d)
        fi

        echo "=== compliance summary ==="
        cat "$verdicts" 2>/dev/null || true

        # Write a markdown summary table to the workflow job summary page.
        # INFO: floating-ref rows + all rejections. DEBUG: every row.
        {
          echo "## Compliance Gate"
          echo ""
          echo "| Action | Requested | Selected Version | Commit SHA | Verdict |"
          echo "| --- | --- | --- | --- | --- |"
          while IFS=$'\t' read -r _status _pkg _ref _ver _sha _reason; do
            # INFO mode: skip approved/filtered rows whose ref is already pinned (not floating).
            if [ "${SUMMARY_LEVEL:-INFO}" = "INFO" ] && [ "$_status" != "REJECTED" ]; then
              is_floating_ref "$_ref" || continue
            fi
            case "$_status" in
              APPROVED) _badge="✅ Approved" ;;
              FILTERED) _badge="⚠️ Filtered — \`$_reason\`" ;;
              REJECTED) _badge="❌ Rejected — \`$_reason\`" ;;
              *)        _badge="$_status" ;;
            esac
            _sha_short="${_sha:0:7}"
            echo "| \`$_pkg\` | \`@$_ref\` | \`${_ver:----}\` | \`${_sha_short:----}\` | $_badge |"
          done < "$verdicts"
        } >> "$GITHUB_STEP_SUMMARY"

        if grep -q '^REJECTED' "$verdicts" 2>/dev/null; then
          echo "::error::compliance gate failed — one or more actions are non-compliant"
          exit 1
        fi
        echo "compliance gate passed"
