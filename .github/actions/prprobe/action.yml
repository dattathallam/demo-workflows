name: pr-probe-local-action
description: Local composite action. The PR version references setup-java instead.
runs:
  using: composite
  steps:
    - name: PR-VERSION marker
      shell: bash
      run: echo "LOCAL ACTION VERSION = PR-MODIFIED"
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
