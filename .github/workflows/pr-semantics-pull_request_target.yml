name: pr-semantics-pull_request_target
# WORKFLOW-VERSION = PR-MODIFIED
on:
  pull_request_target:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: identity and resolution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "=== identity ==="
          echo "GITHUB_EVENT_NAME   = $GITHUB_EVENT_NAME"
          echo "GITHUB_REF          = $GITHUB_REF"
          echo "GITHUB_SHA          = $GITHUB_SHA"
          echo "GITHUB_WORKFLOW_REF = $GITHUB_WORKFLOW_REF"
          echo "GITHUB_BASE_REF     = $GITHUB_BASE_REF"
          echo "GITHUB_HEAD_REF     = $GITHUB_HEAD_REF"
          echo "base sha (event)    = $(jq -r .pull_request.base.sha "$GITHUB_EVENT_PATH")"
          echo "head sha (event)    = $(jq -r .pull_request.head.sha "$GITHUB_EVENT_PATH")"
          echo "=== _actions pre-resolved at job start ==="
          find "$RUNNER_WORKSPACE/../_actions" -maxdepth 3 2>/dev/null | sed 's|.*/_actions|_actions|' | grep -v '\.completed' | sort
          echo "=== which version of the LOCAL action does GITHUB_SHA see? ==="
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.github/actions/prprobe/action.yml?ref=$GITHUB_SHA" \
            | grep -E 'VERSION =|uses:' || echo "  (fetch failed)"
          echo "=== which version of THIS WORKFLOW does GITHUB_SHA see? ==="
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$(echo "$GITHUB_WORKFLOW_REF" | sed "s|^$GITHUB_REPOSITORY/||; s|@.*||")?ref=$GITHUB_SHA" \
            | grep -E 'WORKFLOW-VERSION' || echo "  (no marker found)"
      - name: checkout (default ref for this trigger)
        uses: actions/checkout@v4
      - name: which ref did checkout actually give us?
        run: |
          echo "HEAD = $(git rev-parse HEAD)"
          echo "--- the local action as checked out ---"
          grep -E 'VERSION =|uses:' .github/actions/prprobe/action.yml || true
      - name: run the local composite action
        uses: ./.github/actions/prprobe

  # The classic "pwn request" shape: workflow text comes from base (trusted), but it
  # explicitly checks out the PR head, so the workspace holds attacker-controlled files.
  base-workflow-head-checkout:
    runs-on: ubuntu-latest
    steps:
      - name: what does the API at GITHUB_SHA claim the local action is?
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "GITHUB_SHA = $GITHUB_SHA  (base)"
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.github/actions/prprobe/action.yml?ref=$GITHUB_SHA" \
            | grep -E 'VERSION =|uses: actions/' | sed 's/^/  API SAYS: /'

      - name: checkout the PR HEAD explicitly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: what is actually on disk now?
        run: |
          grep -E 'VERSION =|uses: actions/' .github/actions/prprobe/action.yml | sed 's/^/  ON DISK: /'

      - name: _actions BEFORE the local composite runs (the gate's vantage point)
        run: |
          echo "is the local action itself anywhere in _actions?"
          find "$RUNNER_WORKSPACE/../_actions" -ipath '*prprobe*' 2>/dev/null | sed 's/^/  /' || true
          echo "  (nothing above means: not present)"
          echo "full _actions tree:"
          find "$RUNNER_WORKSPACE/../_actions" -maxdepth 3 2>/dev/null | sed 's|.*/_actions|_actions|' | sort | sed 's/^/  BEFORE: /'

      - name: run the local composite action from the workspace
        uses: ./.github/actions/prprobe

      - name: what did the runner actually fetch?
        run: |
          find "$RUNNER_WORKSPACE/../_actions" -maxdepth 3 2>/dev/null | sed 's|.*/_actions|_actions|' | grep -E 'setup-(node|java)' | sort | sed 's/^/  FETCHED: /'

  # No checkout at all: nothing has populated the workspace, so there is no local action to read.
  base-workflow-no-checkout:
    runs-on: ubuntu-latest
    steps:
      - name: workspace state before any checkout
        run: |
          echo "GITHUB_WORKSPACE contents:"
          ls -la "$GITHUB_WORKSPACE" 2>&1 | head -5
          test -f "$GITHUB_WORKSPACE/.github/actions/prprobe/action.yml" && echo "local action PRESENT" || echo "local action ABSENT"
      - name: run the local composite action with nothing checked out
        continue-on-error: true
        uses: ./.github/actions/prprobe
      - name: did it run?
        run: echo "reached the step after the local action"
