name: Compliance Gate

on:
  workflow_call:
    inputs:
      api-base-url:
        description: >
          Base URL of the curation server (exposes /filterVersions and /curation).
          Defaults to the COMPLIANCE_SERVER_URL repository variable — see the
          api-base-url passed to the gate below. Only set this to aim one run at a
          different server.
        required: false
        type: string

jobs:
  compliance:
    runs-on: self-hosted
    steps:
      - name: Check action compliance
        uses: dattathallam/demo-compliance-action@main
        with:
          mock_server_url: ${{ inputs.compliance_server_url || vars.COMPLIANCE_SERVER_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          min_age_days: ${{ inputs.min_age_days || '30' }}
          fail_on_violation: 'true'
      - name: Run compliance gate
        uses: dattathallam/demo-workflows@main
        with:
          github-token: ${{ secrets.ADMIN_READ_PAT }}
          # Resolved here rather than as an input default: an unset input arrives
          # as an empty string, and an explicit empty value overrides the gate
          # action's own default instead of falling back to it.
          api-base-url: ${{ inputs.api-base-url || vars.COMPLIANCE_SERVER_URL }}
