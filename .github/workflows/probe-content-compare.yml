name: probe-content-compare

# Can a step tell whether an action the runner downloaded at job setup is the same content that a
# fresh download of the same ref serves now? And when it is not, which stages of the action run the
# runner's copy and which run a swapped-in copy? Run on every runner kind: hosted Linux, Windows and
# macOS, and a self-hosted macOS runner (label cmp-probe).
#
# .github/scripts/compare_action_cache.py walks _actions the way curate-gh-actions discovers it,
# downloads each root's ref from GitHub's tarball endpoint, and compares the archive entry by entry
# against the runner's copy (extras on the runner are listed, not counted).
#
# Fixture actions live on the orphan branch cmp-fixtures, which holds no workflows:
#   version A = 09ef760dcd1025723fc91e55e22bc59fdec35acb  (tag cmp-stable, never moves)
#   version B = bb84f1b6e65d757857979c1235ed5c201083f32c  (every VERSION is B; node-nopre gains a post)
# Each fixture prints "CMP-RESULT action=... stage=... version=..." from the content it ran.
#
# Docker container actions run on Linux only (the runner refuses them elsewhere at job setup), so
# the docker fixture is not in this matrix. Its behavior was measured on Linux in run 36559164202:
# pre-entrypoint and main both ran the image built from version A, even after the swap.
#
# Ordering - every job's setup must see cmp-moving where the design expects it:
#   reset-moving-tag  cmp-moving -> A
#   same-version      (parallel) nothing moves cmp-moving here: expect IDENTICAL everywhere
#   moving-tag        (one at a time) runner downloads A, a step moves the tag to B, compare
#                     expects DIFFERENT, swap installs B, every stage reports what it ran, and a
#                     final step moves the tag back to A for the next runner

on:
  workflow_dispatch:

env:
  FIXTURE_A: 09ef760dcd1025723fc91e55e22bc59fdec35acb
  FIXTURE_B: bb84f1b6e65d757857979c1235ed5c201083f32c

defaults:
  run:
    shell: bash

jobs:
  reset-moving-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Point cmp-moving at version A
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/cmp-moving" -f sha="$FIXTURE_A" -F force=true --jq .object.sha

  same-version:
    needs: reset-moving-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            py: python3
          - name: windows
            runner: windows-latest
            py: python
          - name: macos
            runner: macos-latest
            py: python3
          - name: self-hosted-macos
            runner: [self-hosted, cmp-probe]
            py: python3
    name: same-version (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    env:
      PY: ${{ matrix.py }}
    steps:
      # node, pre + main + post
      - uses: step-security/harden-runner@v2
        if: false
      # node, main + post, mutable major tag
      - uses: actions/checkout@v4
      # node, pinned by full SHA (v4.2.2)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: sha-pinned-checkout
      # node, main + post
      - uses: actions/setup-node@v4
        if: false
      # composite, exact tag
      - uses: ludeeus/action-shellcheck@2.0.0
        if: false
      # composite that nests a remote action (actions/upload-artifact)
      - uses: actions/upload-pages-artifact@v3
        if: false

      - name: Compare before any fixture main step ran (only pre steps have)
        env:
          GH_TOKEN: ${{ github.token }}
        run: $PY .github/scripts/compare_action_cache.py compare --label same-version-before-mains

      # fixtures at the stable tag: node with pre (and a symlink), composite nesting node
      - uses: dattathallam/demo-workflows/node-pre@cmp-stable
      - uses: dattathallam/demo-workflows/composite@cmp-stable

      - name: Compare after the fixture main steps ran
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: $PY .github/scripts/compare_action_cache.py compare --label same-version-after-mains

  moving-tag:
    needs: same-version
    strategy:
      fail-fast: false
      # One at a time: each job moves the shared tag and must find it at A during its own setup.
      max-parallel: 1
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            py: python3
          - name: windows
            runner: windows-latest
            py: python
          - name: macos
            runner: macos-latest
            py: python3
          - name: self-hosted-macos
            runner: [self-hosted, cmp-probe]
            py: python3
    name: moving-tag (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      PY: ${{ matrix.py }}
    steps:
      - uses: actions/checkout@v4

      - name: Move cmp-moving to version B after the runner downloaded A
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/cmp-moving" -f sha="$FIXTURE_B" -F force=true --jq .object.sha
          # The tarball endpoint caches a tag's target for a while after the commits API already
          # reports the move (measured in run 36558887915), so wait on the tarball itself.
          start=$SECONDS
          for i in $(seq 1 60); do
            top=$(curl -sSfL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/tarball/cmp-moving" | tar -tzf - | head -1)
            if [[ "$top" == *"${FIXTURE_B:0:7}"* ]]; then
              echo "tarball of cmp-moving serves B ($top) after $((SECONDS - start))s, ${i} poll(s)"; exit 0
            fi
            echo "poll $i: tarball of cmp-moving still serves $top"
            sleep 10
          done
          exit 1

      - name: Compare - the runner holds A, the tag now serves B
        env:
          GH_TOKEN: ${{ github.token }}
        run: $PY .github/scripts/compare_action_cache.py compare --label moving-before-swap

      - name: Swap every DIFFERENT root for the served content (what curate-gh-actions does)
        run: $PY .github/scripts/compare_action_cache.py swap

      - name: Compare after the swap
        env:
          GH_TOKEN: ${{ github.token }}
        run: $PY .github/scripts/compare_action_cache.py compare --label moving-after-swap

      - uses: dattathallam/demo-workflows/node-pre@cmp-moving
      - uses: dattathallam/demo-workflows/node-nopre@cmp-moving
      - uses: dattathallam/demo-workflows/composite@cmp-moving

      - name: Move cmp-moving back to version A for the next runner
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/cmp-moving" -f sha="$FIXTURE_A" -F force=true --jq .object.sha
